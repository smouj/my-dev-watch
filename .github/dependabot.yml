version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major upgrades change the build model (Gradle 9, AGP 9, Kotlin majors) and
      # are handled as reviewed migrations, never as an automatic bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      androidx:
        patterns:
          - "androidx.*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
