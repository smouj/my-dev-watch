name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish CLI and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build distributions
        run: ./gradlew :tools:cli:distZip :tools:cli:distTar -PwithAndroid=false --console=plain

      - name: Name artefacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp tools/cli/build/distributions/cli-$VERSION.zip "dist/my-dev-watch-$VERSION.zip"
          cp tools/cli/build/distributions/cli-$VERSION.tar "dist/my-dev-watch-$VERSION.tar"
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            assets/branding/logo-color.png
