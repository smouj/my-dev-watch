name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish CLI and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build CLI distributions
        run: ./gradlew :tools:cli:distZip :tools:cli:distTar -PwithAndroid=false --console=plain

      - name: Build Android APK
        run: ./gradlew :android:app:assembleDebug -PwithAndroid=true --console=plain

      - name: Name artefacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CLI_ZIP=$(ls tools/cli/build/distributions/*.zip | head -1)
          CLI_TAR=$(ls tools/cli/build/distributions/*.tar | head -1)
          cp "$CLI_ZIP" "dist/my-dev-watch-$VERSION.zip"
          cp "$CLI_TAR" "dist/my-dev-watch-$VERSION.tar"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/my-dev-watch-$VERSION-debug.apk"
          ls -lh dist
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            assets/branding/logo-color.png
