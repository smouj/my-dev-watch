name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test every JVM module
        run: ./gradlew build -PwithAndroid=false --console=plain --stacktrace
      - name: Verify the CLI runs
        run: |
          ./gradlew :tools:cli:installDist -PwithAndroid=false --console=plain
          ./tools/cli/build/install/my-dev-watch/bin/my-dev-watch commands | head -5
          ./tools/cli/build/install/my-dev-watch/bin/my-dev-watch battery A2 56

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :android:app:assembleDebug -PwithAndroid=true --console=plain --stacktrace
      - name: Report APK
        run: ls -lh android/app/build/outputs/apk/debug/
